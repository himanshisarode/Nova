# fly.toml app configuration file generated for nova-aug47w on 2026-10-30T20:55:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nova-aug47w'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NOVA_DB_PATH = '/data/nova.db'

[[mounts]]
  source = 'nova_data'
  destination = '/data'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
